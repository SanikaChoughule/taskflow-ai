services:
  - type: web
    name: taskflow-ai
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_SECRETS_JSON
        sync: false
      - key: OAUTHLIB_INSECURE_TRANSPORT
        value: "1"
